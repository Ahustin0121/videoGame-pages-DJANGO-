<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Videojuego | PixelVault & Co.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-light">

    {% include 'partials/navbar.html' %}

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card bg-dark border-danger rounded-4 text-center">
                    <div class="card-body p-4 p-md-5">
                        <i class="fa-solid fa-triangle-exclamation text-danger fs-1 mb-3"></i>
                        <h1 class="fw-bold h3 mb-2">¿Eliminar este videojuego?</h1>
                        <p class="text-secondary mb-1">Estás a punto de eliminar:</p>
                        <h2 class="fw-bold text-white h5 mb-4">{{ producto.nombre }}</h2>
                        <p class="small text-secondary mb-4">
                            <i class="fa-solid fa-gamepad me-1"></i>{{ producto.consola }} ·
                            <i class="fa-solid fa-tag me-1 ms-2"></i>${{ producto.precio }}
                        </p>

                        <form method="post">
                            {% csrf_token %}
                            <div class="d-flex gap-3 justify-content-center">
                                <button type="submit" class="btn btn-danger fw-bold px-4 py-2">
                                    <i class="fa-solid fa-trash me-2"></i>Sí, eliminar
                                </button>
                                <a href="{% url 'gestionar_videojuegos' %}" class="btn btn-outline-secondary px-4 py-2 text-white">
                                    Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
